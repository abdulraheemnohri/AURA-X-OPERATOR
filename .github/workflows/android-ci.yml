name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "12266719"
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "platforms;android-28" "build-tools;34.0.0" "platform-tools" "cmake;3.31.6" "ndk;25.2.9519653"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.2"
      - name: Toolchain diagnostics
        run: |
          set -o pipefail
          java -version 2>&1 | tee java-version.txt
          gradle --version 2>&1 | tee gradle-version.txt
          adb version 2>&1 | tee adb-version.txt
          cmake --version 2>&1 | tee cmake-version.txt
          echo "ANDROID_HOME=$ANDROID_HOME" | tee environment.txt
          echo "ANDROID_NDK=$ANDROID_NDK" | tee -a environment.txt
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$CMAKE_BUILD_PARALLEL_LEVEL" | tee -a environment.txt
      - name: Verify Android compatibility configuration
        run: |
          grep -q 'compileSdk = 34' app/build.gradle.kts
          grep -q 'minSdk = 28' app/build.gradle.kts
          grep -q 'targetSdk = 34' app/build.gradle.kts
          grep -q 'ndkVersion = "25.2.9519653"' app/build.gradle.kts
          grep -q 'arm64-v8a' app/build.gradle.kts
          grep -q 'GGML_LLAMAFILE OFF' app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/cpp/native-lib.cpp
          test -f app/src/main/cpp/whisper-native.cpp
      - name: Assemble debug APK
        id: build_apk
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --info assembleDebug 2>&1 | tee assemble-debug.log
      - name: Run unit tests
        id: unit_tests
        if: ${{ steps.build_apk.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee unit-tests.log
      - name: Verify APK output
        if: ${{ steps.build_apk.outcome == 'success' }}
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: aura-x-operator-ci-diagnostics-${{ github.run_id }}
          path: |
            assemble-debug.log
            unit-tests.log
            java-version.txt
            gradle-version.txt
            adb-version.txt
            cmake-version.txt
            environment.txt
            app/build/outputs/**/*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Fail if build failed
        if: ${{ steps.build_apk.outcome != 'success' }}
        run: exit 1
      - name: Fail if unit tests failed
        if: ${{ steps.unit_tests.outcome != 'success' }}
        run: exit 1
      - name: Upload debug APK
        if: ${{ steps.build_apk.outcome == 'success' && steps.unit_tests.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: aura-x-operator-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14