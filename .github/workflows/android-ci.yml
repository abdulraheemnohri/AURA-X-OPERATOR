name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "12266719"
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "platforms;android-31" "build-tools;34.0.0" "platform-tools" "cmake;3.31.6" "ndk;25.2.9519653"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.2"
      - name: Toolchain diagnostics
        run: |
          java -version
          gradle --version
          adb version
          cmake --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$CMAKE_BUILD_PARALLEL_LEVEL"
      - name: Verify Android 31+ configuration
        run: |
          grep -q 'compileSdk = 34' app/build.gradle.kts
          grep -q 'minSdk = 31' app/build.gradle.kts
          grep -q 'targetSdk = 34' app/build.gradle.kts
          grep -q 'ndkVersion = "25.2.9519653"' app/build.gradle.kts
          grep -q 'arm64-v8a' app/build.gradle.kts
          grep -q 'GGML_LLAMAFILE OFF' app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/cpp/native-lib.cpp
          test -f app/src/main/cpp/whisper-native.cpp
      - name: Assemble Android 31+ debug APK
        id: build_apk
        run: gradle --no-daemon --stacktrace --info assembleDebug
      - name: Verify APK output
        if: ${{ steps.build_apk.outcome == 'success' }}
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Run unit tests
        if: ${{ steps.build_apk.outcome == 'success' }}
        run: gradle --no-daemon --stacktrace testDebugUnitTest
      - name: Upload Android 31+ debug APK
        if: ${{ steps.build_apk.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: aura-x-operator-android31plus-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
