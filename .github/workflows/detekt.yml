name: Detekt

on:
  push:
    branches: ["main", "nexus-v5"]
  pull_request:
    branches: ["main", "nexus-v5"]

jobs:
  detekt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.2"
      - name: Run app Detekt
        id: detekt
        continue-on-error: true
        run: gradle --no-daemon --stacktrace :app:detekt
      - name: Print Detekt findings
        if: always()
        shell: bash
        run: |
          echo "===== AURA-X Detekt diagnostics ====="
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          candidates = [
              Path("app/build/reports/detekt/detekt.xml"),
              Path("build/reports/detekt/detekt.xml"),
          ]
          report = next((p for p in candidates if p.is_file()), None)
          if report is None:
              print("Detekt XML report was not generated.")
          else:
              try:
                  root = ET.parse(report).getroot()
                  findings = []
                  for element in root.iter():
                      if element.tag.rsplit("}", 1)[-1] == "error":
                          findings.append(element.attrib)
                  print(f"Detekt XML report: {report}")
                  print(f"Detekt XML findings: {len(findings)}")
                  for finding in findings:
                      print(finding)
              except (ET.ParseError, OSError) as error:
                  print(f"Unable to parse Detekt XML report: {error}")
          PY
          for report in app/build/reports/detekt/detekt.html build/reports/detekt/detekt.html; do
            if [ -f "$report" ]; then
              echo "Detekt HTML report generated: $report"
            fi
          done
          echo "===== End AURA-X Detekt diagnostics ====="
      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: detekt-report
          path: |
            build/reports/detekt/
            app/build/reports/detekt/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail when Detekt reports violations
        if: steps.detekt.outcome == 'failure'
        run: exit 1
